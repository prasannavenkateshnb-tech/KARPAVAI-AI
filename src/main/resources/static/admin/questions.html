<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Management</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="section"><span class="pill">ADMIN • QUESTION MANAGEMENT</span><h1>Manage question bank</h1><div class="panel"><form id="form" class="formgrid"><input id="companyId" placeholder="Company ID" type="number" required><input id="year" placeholder="Year" type="number" value="2026" required><input id="category" placeholder="Category" required><input id="topic" placeholder="Topic" required><input id="difficulty" placeholder="Difficulty" value="Medium" required><input id="role" placeholder="Role" value="Software Developer"><input id="round" placeholder="Round" value="Technical Interview"><input id="frequency" placeholder="Frequency" value="Frequently Asked"><textarea id="questionText" placeholder="Question" required></textarea><textarea id="expectedAnswer" placeholder="Expected answer"></textarea><textarea id="explanation" placeholder="Explanation"></textarea><button class="btn">Add Question</button></form></div><div id="list" class="list"></div></main><script src="/js/api.js"></script><script>async function load(){let x=await api('/api/questions/admin/all');list.innerHTML=x.slice(-30).reverse().map(q=>`<div class="card"><span class="badge">${q.category}</span><h3>${q.questionText}</h3><p>${q.company.name} • ${q.year} • ${q.difficulty}</p></div>`).join('')}form.onsubmit=async e=>{e.preventDefault();let body={company:{id:+companyId.value},year:+year.value,category:category.value,topic:topic.value,difficulty:difficulty.value,role:role.value,round:round.value,frequency:frequency.value,questionText:questionText.value,expectedAnswer:expectedAnswer.value,explanation:explanation.value,tags:category.value};let r=await api('/api/questions/admin','POST',body);alert(r.id?'Question added':'Could not add');load()};load()</script></body></html>
