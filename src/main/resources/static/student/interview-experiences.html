<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experiences</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="section"><span class="pill">INTERVIEW EXPERIENCES</span><h1>Learn from interview journeys</h1><div id="list" class="grid"></div></main><script src="/js/api.js"></script><script>async function load(){let x=await api('/api/interview-experiences');list.innerHTML=x.map(e=>`<div class="card"><span class="badge">${e.difficulty}</span><h3>${e.company.name} • ${e.role}</h3><p>${e.year} • ${e.rounds} rounds • ${e.interviewType}</p><p>${e.description}</p><b>Tips:</b><p>${e.preparationTips}</p></div>`).join('')}load()</script></body></html>
