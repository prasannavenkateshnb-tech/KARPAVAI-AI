<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questions</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="layout"><aside><div class="brand">⚡ KARPAVAI.AI</div><a href="/student/dashboard.html">Dashboard</a><a class="active">Questions</a><a href="/student/mock-test.html">AI Mock Test</a><a href="/student/ai-lab.html">AI Preparation Lab</a><a href="/companies.html">Companies</a><a href="/student/progress.html">Readiness</a></aside><main class="dash"><div class="heading"><div><span class="pill">QUESTION BANK</span><h1>Practice smarter</h1></div><input id="search" placeholder="Search questions..."></div><div id="qs" class="list"></div></main></div><script src="/js/api.js"></script><script>async function load(){let q=await api('/api/questions'+(search.value?'?search='+encodeURIComponent(search.value):''));qs.innerHTML=q.map(x=>`<div class="question card"><div><span class="badge">${x.difficulty}</span> <span class="badge">${x.category}</span><h3>${x.questionText}</h3><p>${x.company.name} • ${x.year} • ${x.topic}</p></div><div class="actions"><button class="btn small" onclick="solve(${x.id})">✓ Solved</button><button class="btn small ghost" onclick="bookmark(${x.id})">☆ Revision</button><button class="btn small ghost" onclick="alert(x.expectedAnswer||'Answer not available')">View Answer</button></div></div>`).join('')}async function solve(id){await api('/api/questions/'+id+'/solve','POST');alert('Progress updated!');}async function bookmark(id){await api('/api/questions/'+id+'/bookmark','POST');alert('Revision list updated!')}search.oninput=load;load()</script></body></html>
