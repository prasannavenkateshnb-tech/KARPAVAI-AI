<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Readiness</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="section"><span class="pill">READINESS ENGINE</span><h1>Know exactly what to prepare next</h1><div class="statgrid"><div class="metric"><span>Overall</span><strong id="o">--%</strong></div><div class="metric"><span>DSA</span><strong id="d">--%</strong></div><div class="metric"><span>Java</span><strong id="j">--%</strong></div><div class="metric"><span>SQL</span><strong id="s">--%</strong></div></div><div class="panel"><h2>Weakness Heatmap</h2><div id="heat"></div><h2>Recommended Next Steps</h2><ol id="steps"></ol></div></main><script src="/js/api.js"></script><script>async function load(){let r=await api('/api/student/readiness');o.textContent=r.overall+'%';d.textContent=r.DSA+'%';j.textContent=r.Java+'%';s.textContent=r.SQL+'%';heat.innerHTML=['DSA','Java','SQL'].map(k=>`<div class="skill"><span>${k}</span><b>${r[k]}%</b><div class="bar"><i style="width:${r[k]}%"></i></div></div>`).join('');steps.innerHTML=r.weakAreas.map(x=>`<li>Solve 5 focused ${x} questions and review the explanation.</li>`).join('')}load()</script></body></html>
