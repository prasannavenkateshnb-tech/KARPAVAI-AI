<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="section" id="app"></main><script src="/js/api.js"></script><script>let id=new URLSearchParams(location.search).get('id');async function load(){let d=await api('/api/companies/'+id);app.innerHTML=`<span class="pill">TARGET COMPANY</span><h1>${d.company.name}</h1><p>${d.company.description}</p><div class="panel"><h2>Recruitment Roadmap</h2><div class="rounds"><span>1 Aptitude</span><span>2 Coding</span><span>3 Technical</span><span>4 HR</span></div></div><h2>Questions (${d.questions.length})</h2><div class="list">${d.questions.slice(0,12).map(q=>`<div class="card"><span class="badge">${q.difficulty}</span><h3>${q.questionText}</h3><p>${q.category} • ${q.topic} • ${q.year}</p></div>`).join('')}</div>`}load()</script></body></html>
